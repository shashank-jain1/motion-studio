# Typecheck, the engine/motion/sound/reflow/visual-edit/version suites, the web build, and the server tests
# (remote MCP OAuth flow + the director loop against a fake Claude) on every push and pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Chromium libraries for Remotion's headless shell (same list as the Dockerfile) + FFmpeg for contact sheets.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fontconfig fonts-dejavu-core fonts-noto-color-emoji \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, test suites, web build
        run: pnpm run verify:motion
        env:
          MOTION_STUDIO_GL: swangle

      - name: Server (remote MCP + director loop)
        run: pnpm run test:server
        env:
          MOTION_STUDIO_GL: swangle
