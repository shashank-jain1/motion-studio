<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Dhaari as a cub, DevFest Bhopal 2026</title>
  <g stroke="#1E1E1E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- Upper Lake -->
    <path d="M0 708 Q50 690 100 708 T200 708 T300 708 T400 708 T500 708 T600 708 T700 708 T800 708 V800 H0 Z" fill="#C3ECF6"/>
    <path d="M0 742 Q50 724 100 742 T200 742 T300 742 T400 742 T500 742 T600 742 T700 742 T800 742 V800 H0 Z" fill="#57CAFF"/>

    <!-- Patiya (the old-Bhopal wooden bench) -->
    <rect x="152" y="600" width="30" height="120" fill="#B5652B"/>
    <rect x="618" y="600" width="30" height="120" fill="#B5652B"/>
    <path d="M168 556 H632 L668 590 H132 Z" fill="#D9B48A"/>
    <rect x="132" y="590" width="536" height="34" fill="#B5652B"/>
    <path d="M160 607 H300 M360 607 H520 M560 607 H640" fill="none" stroke-width="3" opacity=".45"/>

    <!-- Kulhad chai -->
    <path d="M174 510 L226 510 Q230 540 216 566 Q200 572 184 566 Q170 540 174 510 Z" fill="#B5652B"/>
    <ellipse cx="200" cy="510" rx="26" ry="7" fill="#7A3B17"/>
    <path d="M178 524 Q200 530 222 524" fill="none" stroke-width="3" opacity=".5"/>
    <path d="M192 494 q-10 -10 0 -20 t0 -20 M210 490 q-8 -9 0 -18 t0 -18" fill="none" stroke-width="4" opacity=".55"/>

    <!-- Tail: outline, fur, then dashed stripes -->
    <path d="M505 566 C590 580 648 540 636 478 C630 446 604 438 592 458" fill="none" stroke-width="42"/>
    <path d="M505 566 C590 580 648 540 636 478 C630 446 604 438 592 458" fill="none" stroke="#F9AB00" stroke-width="30"/>
    <path d="M505 566 C590 580 648 540 636 478 C630 446 604 438 592 458" fill="none" stroke-width="30" stroke-linecap="butt" stroke-dasharray="11 27" stroke-dashoffset="-30"/>

    <!-- Torso -->
    <path d="M284 586 C266 500 300 392 400 392 C500 392 534 500 516 586 Z" fill="#F9AB00"/>

    <!-- Bagh-print jacket (white cloth, madder + indigo blocks) -->
    <path d="M412 398 C478 400 532 480 516 586 L424 586 L436 468 Z" fill="#FFFBF2"/>
    <path d="M388 398 C322 400 268 480 284 586 L376 586 L364 468 Z" fill="#FFFBF2"/>
    <g stroke="none">
      <g fill="#9E2A1F">
        <ellipse cx="480" cy="478" rx="6" ry="13"/><ellipse cx="480" cy="478" rx="13" ry="6"/>
        <ellipse cx="490" cy="548" rx="6" ry="13"/><ellipse cx="490" cy="548" rx="13" ry="6"/>
        <ellipse cx="458" cy="514" rx="5" ry="10"/><ellipse cx="458" cy="514" rx="10" ry="5"/>
        <ellipse cx="452" cy="420" rx="4" ry="8"/><ellipse cx="452" cy="420" rx="8" ry="4"/>
      </g>
      <g fill="#1F2440">
        <circle cx="480" cy="478" r="4"/><circle cx="490" cy="548" r="4"/><circle cx="458" cy="514" r="3.4"/><circle cx="452" cy="420" r="2.8"/>
        <circle cx="503" cy="512" r="2.6"/><circle cx="468" cy="448" r="2.6"/><circle cx="460" cy="572" r="2.6"/><circle cx="500" cy="448" r="2.6"/><circle cx="478" cy="580" r="2.6"/>
      </g>
    </g>
    <path d="M412 398 C478 400 532 480 516 586 M424 586 L436 468 L412 398 M388 398 L364 468 L376 586" fill="none" stroke="#9E2A1F" stroke-width="8"/>

    <!-- Feet over the patiya edge -->
    <ellipse cx="338" cy="604" rx="38" ry="25" fill="#F9AB00"/>
    <ellipse cx="462" cy="604" rx="38" ry="25" fill="#F9AB00"/>
    <path d="M326 615 v12 M350 615 v12 M450 615 v12 M474 615 v12" fill="none" stroke-width="4"/>

    <!-- Closed laptop hugged like a sticker-covered book -->
    <g transform="rotate(-6 368 506) translate(368 506) scale(.92) translate(-368 -506)">
      <rect x="268" y="430" width="204" height="150" rx="16" fill="#1F2440"/>
      <path d="M284 580 H456" fill="none" stroke="#5F6378" stroke-width="5"/>
      <!-- Google sticker -->
      <circle cx="318" cy="472" r="25" fill="#FFFFFF"/>
      <g stroke="none">
        <circle cx="318" cy="460" r="6" fill="#4285F4"/>
        <circle cx="330" cy="472" r="6" fill="#EA4335"/>
        <circle cx="318" cy="484" r="6" fill="#F9AB00"/>
        <circle cx="306" cy="472" r="6" fill="#34A853"/>
      </g>
      <!-- Code sticker -->
      <rect x="370" y="450" width="74" height="46" rx="10" fill="#CCF6C5" stroke-width="4"/>
      <path d="M396 459 q-8 0 -8 7 v3 q0 4 -5 4 q5 0 5 4 v3 q0 7 8 7 M418 459 q8 0 8 7 v3 q0 4 5 4 q-5 0 -5 4 v3 q0 7 -8 7" fill="none" stroke="#34A853" stroke-width="5"/>
      <!-- Upper Lake sticker -->
      <rect x="330" y="514" width="96" height="40" rx="20" fill="#57CAFF" stroke-width="4"/>
      <path d="M344 536 q8 -8 16 0 t16 0 t16 0 t16 0" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    </g>

    <!-- Arms and paws holding the laptop -->
    <path d="M318 418 C286 438 268 470 270 500" fill="none" stroke-width="46"/>
    <path d="M318 418 C286 438 268 470 270 500" fill="none" stroke="#F9AB00" stroke-width="34"/>
    <circle cx="272" cy="506" r="25" fill="#F9AB00"/>
    <path d="M262 524 v8 M280 524 v8" fill="none" stroke-width="4"/>
    <path d="M292 446 l-14 10 M298 462 l-16 8" fill="none" stroke-width="7"/>

    <path d="M482 420 C500 430 494 448 470 452" fill="none" stroke-width="46"/>
    <path d="M482 420 C500 430 494 448 470 452" fill="none" stroke="#F9AB00" stroke-width="34"/>
    <circle cx="458" cy="446" r="25" fill="#F9AB00"/>
    <path d="M444 430 v-8 M462 428 v-8" fill="none" stroke-width="4"/>

    <!-- Ears -->
    <circle cx="290" cy="168" r="46" fill="#F9AB00"/>
    <circle cx="510" cy="168" r="46" fill="#F9AB00"/>
    <circle cx="294" cy="172" r="22" fill="#FF7DAF" stroke-width="4"/>
    <circle cx="506" cy="172" r="22" fill="#FF7DAF" stroke-width="4"/>

    <!-- Head with cheek ruffs -->
    <path d="M400 140 C490 140 552 195 552 268 L570 290 L546 300 L558 322 L530 322 C505 370 460 394 400 394 C340 394 295 370 270 322 L242 322 L254 300 L230 290 L248 268 C248 195 310 140 400 140 Z" fill="#F9AB00"/>

    <!-- Code stripes: // on the forehead, < and > on the cheeks -->
    <path d="M384 190 L396 190 L384 228 L372 228 Z M406 190 L418 190 L406 228 L394 228 Z" fill="#1E1E1E" stroke-width="3"/>
    <path d="M292 284 L262 304 L292 324" fill="none" stroke-width="11"/>
    <path d="M508 284 L538 304 L508 324" fill="none" stroke-width="11"/>
    <path d="M256 228 l22 6 M546 228 l-22 6" fill="none" stroke-width="9"/>

    <!-- Face -->
    <ellipse cx="400" cy="326" rx="56" ry="40" fill="#FFFBF2"/>
    <ellipse cx="346" cy="300" rx="16" ry="9" fill="#FF7DAF" stroke="none" opacity=".6"/>
    <ellipse cx="454" cy="300" rx="16" ry="9" fill="#FF7DAF" stroke="none" opacity=".6"/>
    <ellipse cx="352" cy="262" rx="14" ry="18" fill="#1E1E1E" stroke="none"/>
    <ellipse cx="448" cy="262" rx="14" ry="18" fill="#1E1E1E" stroke="none"/>
    <circle cx="347" cy="255" r="5" fill="#FFFFFF" stroke="none"/>
    <circle cx="443" cy="255" r="5" fill="#FFFFFF" stroke="none"/>
    <path d="M384 302 Q400 294 416 302 Q414 314 400 320 Q386 314 384 302 Z" fill="#FF7DAF" stroke-width="4"/>
    <path d="M400 320 v6 M380 330 Q390 344 400 328 Q410 344 420 330" fill="none" stroke-width="5"/>
    <g fill="#1E1E1E" stroke="none">
      <circle cx="366" cy="332" r="2.8"/><circle cx="374" cy="342" r="2.8"/><circle cx="362" cy="344" r="2.8"/>
      <circle cx="434" cy="332" r="2.8"/><circle cx="426" cy="342" r="2.8"/><circle cx="438" cy="344" r="2.8"/>
    </g>

    <!-- Bhopali topi, maroon velvet with a zari band -->
    <g transform="rotate(-8 400 150)">
      <path d="M318 172 L330 96 Q400 70 470 96 L482 172 Q400 184 318 172 Z" fill="#9E2A1F"/>
      <path d="M321 152 Q400 164 479 152 L482 172 Q400 184 318 172 Z" fill="#C9A13B" stroke-width="5"/>
      <g fill="#1F2440" stroke="none">
        <circle cx="340" cy="165" r="3"/><circle cx="370" cy="169" r="3"/><circle cx="400" cy="170" r="3"/><circle cx="430" cy="169" r="3"/><circle cx="460" cy="165" r="3"/>
      </g>
      <g fill="none" stroke="#C9A13B" stroke-width="4">
        <path d="M400 106 q14 10 0 26 q-14 -16 0 -26 Z"/>
        <path d="M386 128 q-10 2 -14 12 M414 128 q10 2 14 12"/>
      </g>
    </g>

    <!-- A bug on her tail -->
    <g transform="translate(586 548)">
      <path d="M-14 -4 l-8 -4 M-14 4 l-9 2 M14 -4 l8 -4 M14 4 l9 2 M-8 10 l-4 7 M8 10 l4 7 M-4 -16 l-6 -10 M4 -16 l6 -10" fill="none" stroke-width="3"/>
      <circle cx="0" cy="-12" r="7" fill="#1E1E1E" stroke-width="3"/>
      <ellipse cx="0" cy="2" rx="15" ry="14" fill="#EA4335" stroke-width="4"/>
      <path d="M0 -11 V16" fill="none" stroke-width="3"/>
      <circle cx="-7" cy="2" r="2.6" fill="#1E1E1E" stroke="none"/><circle cx="7" cy="2" r="2.6" fill="#1E1E1E" stroke="none"/>
    </g>
  </g>
</svg>
